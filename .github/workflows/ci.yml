name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore NOREA.slnx

      - name: Build
        run: dotnet build NOREA.slnx -c Release --no-restore

      - name: Test
        run: dotnet test NOREA.Tests/NOREA.Tests.csproj -c Release --no-build --verbosity normal
