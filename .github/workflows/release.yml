name: Build & Release Portable Suite

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore NOREA.slnx

      - name: Run Tests
        run: dotnet test NOREA.Tests/NOREA.Tests.csproj --no-restore --verbosity normal

      - name: Build Portable Package
        run: pwsh ./crea_pacchetto_portatile.ps1

      - name: Calculate Checksums
        run: |
          $hash = (Get-FileHash NOREA_Suite_Portable.zip -Algorithm SHA256).Hash
          Set-Content -Path checksums.txt -Value "SHA256 (NOREA_Suite_Portable.zip) = $hash"
          Get-Content checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: NOREA Suite ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            NOREA_Suite_Portable.zip
            checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
