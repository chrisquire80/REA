name: Build & Release Portable Suite

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag già esistente a cui allegare gli asset (es. v2.5.0). Esegui il workflow da main: fa il checkout del tag e non crea né sposta tag.'
        required: true
        type: string
      mark_as_latest:
        description: 'Segna la release come latest. Attivarlo solo per la versione più recente (v2.5.0), non quando si ripubblicano v2.4.0 o v2.4.1.'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Resolve release tag
        id: rel
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $tag = if ($env:EVENT_NAME -eq 'workflow_dispatch') { $env:INPUT_TAG.Trim() } else { $env:REF_NAME.Trim() }
          if ($tag -notmatch '^v\d+\.\d+\.\d+([-+][0-9A-Za-z.-]+)?$') {
            Write-Error "Tag di release non valido: '$tag'. Atteso un tag esistente nel formato vX.Y.Z."
            exit 1
          }
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Confirm the tag already exists
        id: tag
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.rel.outputs.tag }}
        run: |
          $json = gh api "repos/$env:GITHUB_REPOSITORY/git/ref/tags/$env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Il tag $env:RELEASE_TAG non esiste su GitHub. Questo workflow non crea tag."
            exit 1
          }
          $ref = $json | ConvertFrom-Json
          $sha = $ref.object.sha
          $type = $ref.object.type
          # Un tag annotato punta a un oggetto tag: si scende fino al commit.
          # L'API delle release accetta come target_commitish solo un branch o uno SHA, non il nome del tag.
          for ($i = 0; $type -eq 'tag' -and $i -lt 5; $i++) {
            $tagJson = gh api "repos/$env:GITHUB_REPOSITORY/git/tags/$sha"
            if ($LASTEXITCODE -ne 0) {
              Write-Error "Impossibile risolvere il commit del tag $env:RELEASE_TAG."
              exit 1
            }
            $tagObj = $tagJson | ConvertFrom-Json
            $sha = $tagObj.object.sha
            $type = $tagObj.object.type
          }
          if ($type -ne 'commit' -or $sha -notmatch '^[0-9a-fA-F]{40}$') {
            Write-Error "Il tag $env:RELEASE_TAG non risolve a un commit ($type $sha)."
            exit 1
          }
          "sha=$sha" >> $env:GITHUB_OUTPUT
          Write-Host "Tag $env:RELEASE_TAG -> $sha"

      - name: Checkout release sources
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.rel.outputs.tag }}
          fetch-depth: 0

      - name: Generate changelog
        shell: pwsh
        run: |
          ./tools/New-ReleaseNotes.ps1 -Tag ${{ steps.rel.outputs.tag }} -NotesPath release-notes.md

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore NOREA.slnx

      - name: Run Tests
        run: dotnet test NOREA.Tests/NOREA.Tests.csproj --no-restore --verbosity normal

      - name: Build Portable Package
        shell: pwsh
        env:
          NOREA_CODESIGN_PFX_BASE64: ${{ secrets.NOREA_CODESIGN_PFX_BASE64 }}
          NOREA_CODESIGN_PFX_PATH: ${{ secrets.NOREA_CODESIGN_PFX_PATH }}
          NOREA_CODESIGN_PFX_PASSWORD: ${{ secrets.NOREA_CODESIGN_PFX_PASSWORD }}
          NOREA_AZURE_SIGNING_ENDPOINT: ${{ secrets.NOREA_AZURE_SIGNING_ENDPOINT }}
          NOREA_AZURE_SIGNING_ACCOUNT: ${{ secrets.NOREA_AZURE_SIGNING_ACCOUNT }}
          NOREA_AZURE_SIGNING_PROFILE: ${{ secrets.NOREA_AZURE_SIGNING_PROFILE }}
          NOREA_AZURE_TENANT_ID: ${{ secrets.NOREA_AZURE_TENANT_ID }}
          NOREA_AZURE_CLIENT_ID: ${{ secrets.NOREA_AZURE_CLIENT_ID }}
          NOREA_AZURE_CLIENT_SECRET: ${{ secrets.NOREA_AZURE_CLIENT_SECRET }}
        run: ./crea_pacchetto_portatile.ps1

      - name: Calculate Checksums
        run: |
          $hash = (Get-FileHash NOREA_Suite_Portable.zip -Algorithm SHA256).Hash
          Set-Content -Path checksums.txt -Value "SHA256 (NOREA_Suite_Portable.zip) = $hash"
          Get-Content checksums.txt

      # Le attestazioni Sigstore non sono disponibili sui repository privati di un account
      # personale ("Feature not available for user-owned private repositories"). Il controllo
      # SHA-256 del launcher non dipende da questa attestazione: legge asset.digest (sha256:)
      # calcolato da GitHub quando l'asset viene caricato. checksums.txt è sempre allegato.
      - name: Attest release artifacts
        if: github.event.repository.visibility != 'private' || github.event.repository.owner.type == 'Organization'
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: |
            NOREA_Suite_Portable.zip
            checksums.txt

      - name: Verify release artifact attestations
        if: github.event.repository.visibility != 'private' || github.event.repository.owner.type == 'Organization'
        run: |
          gh attestation verify NOREA_Suite_Portable.zip --repo $env:GITHUB_REPOSITORY --signer-workflow "$env:GITHUB_REPOSITORY/.github/workflows/release.yml"
          gh attestation verify checksums.txt --repo $env:GITHUB_REPOSITORY --signer-workflow "$env:GITHUB_REPOSITORY/.github/workflows/release.yml"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          target_commitish: ${{ steps.tag.outputs.sha }}
          name: NOREA Suite ${{ steps.rel.outputs.tag }}
          draft: false
          prerelease: false
          make_latest: ${{ (github.event_name != 'workflow_dispatch' || inputs.mark_as_latest) && 'true' || 'false' }}
          generate_release_notes: false
          body_path: release-notes.md
          files: |
            NOREA_Suite_Portable.zip
            checksums.txt
            CHANGELOG.md
            release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
